; Knobs for rift-loop.ahk. Comments must sit on their own line (INI values don't strip inline comments).
; Points and pixels are in game pixels on the 1440x2560 portrait display, as adb sees it.

[Adb]
Path=C:\Program Files\Netease\MuMuPlayer\nx_main\adb.exe
; The emulator's adb address. A host:port serial is connected again whenever adb loses it, as it does
; when MuMu restarts; an emulator-N serial comes back only when the adb server restarts.
Serial=127.0.0.1:5557
; The game's Android package; "auto" displays are the one it runs on.
Package=com.devsisters.cc
; SurfaceFlinger display id for screencap and screenrecord. auto = the game's display.
CaptureDisplay=auto
; Display index for `input -d`, taps and key holds. auto = the game's display.
InputDisplay=auto

[Points]
; Summon Dimensional Boss, under the rift's energy bar.
SummonX=718
SummonY=625
; Random offset in pixels added to every tap. 0 = exact.
JitterPx=6

[Detect]
; Pixel signatures, "x,y,RRGGBB" joined by "|". A screen matches when every pixel is within Tolerance.
; Summon Dimensional Boss: the purple button's gradient and its yellow lettering.
Summon=620,580,DC44F6|820,580,A242EA|600,610,C026F4|640,665,7D0EEE|700,603,FFF647|718,645,FFF647
; A boss encounter: the red boss icon left of the boss's health bar.
Boss=320,380,FF632D|360,380,FF632D|320,400,FF3617|380,400,FF3617
; The scene change into an encounter: a solid dark brown screen for about 2 s.
Transition=300,800,271D1D|720,1200,271D1D|1100,1000,271D1D|300,1400,271D1D|1100,600,271D1D
; Max difference per colour channel (0-255).
Tolerance=30
; The boss's health bar: its fill's left and right ends when full, and the row read, "x1,x2,y".
HpBar=416,1170,438
; The bar's empty part: a pixel whose every channel is at most this (0-255). The fill is F53154.
HpEmptyMax=112

[Timing]
; How often the screen is checked while a try is out. A poll's period counts from its capture's
; start, so a capture slower than this makes polls back to back.
PollMs=1000
; How often the screen is checked while nothing is deciding, or a stage is waiting for its script.
ClearingPollMs=3000
; With no stage expected yet, polls in a row on Summon Dimensional Boss without a readable stage
; number before the loop stops. Once a stage is known, an unreadable number is carried forward.
UnreadLimit=10
; From the tap on Summon Dimensional Boss: with the button still up by then, the tap didn't start
; an encounter, and the loop summons again.
StartWaitMs=25000
; After an encounter ends: the button back within this long is a loss; none by then is a win.
PassAfterMs=30000

[Stages]
; Movement scripts, one per rift stage: <ScriptDir>\<stage>.txt. See tools/stage-macro/README.md.
ScriptDir=stages
; 1 = a stage without a script whose boss won waits for its script before trying again.
WaitForScript=1

[Record]
; Which boss encounters are recorded to VideoDir (gitignored), named <stage>_<try>_<time>.mp4. Read
; on every try, so F10 can change it mid-run.
; all = every try. unscripted = only tries of a stage with no script. off = none.
Video=unscripted
; screenrecord's time limit, from the tap on Summon Dimensional Boss.
Seconds=45
; screenrecord's bit rate. The video stays at the display's size: a downscaled recording dies when
; the scene changes for the boss.
BitRate=4000000
VideoDir=recordings

[Run]
; Tries in a row a stage may lose before the loop stops. 0 = never stop.
MaxTries=0
LogFile=rift-loop.log
; One CSV row per boss encounter: time, stage, try, script, result, reason, boss_hp_pct, timings, video.
RunsFile=rift-runs.csv

[Hud]
; Node.js 24+, which runs tools/hud's TypeScript directly.
Node=node
