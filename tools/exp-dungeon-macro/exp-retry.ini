; Knobs for exp-retry.ahk. Comments must sit on their own line (INI values don't strip inline comments).
; Points and pixels are in game pixels on the 1440x2560 portrait display, as adb sees it.

[Adb]
Path=C:\Program Files\Netease\MuMuPlayer\nx_main\adb.exe
Serial=emulator-5556
; SurfaceFlinger display id for screencap (adb shell dumpsys SurfaceFlinger --display-id). Empty = default display.
CaptureDisplay=4619827767814508545
; Display index for `input -d`.
InputDisplay=2

[Points]
; The lobby's ENTER button.
EnterX=716
EnterY=2070
; The X button under "Your ticket has been returned" on the DEFEAT screen.
CloseX=720
CloseY=2470
; Random offset in pixels added to every tap. 0 = exact.
JitterPx=6

[Detect]
; Pixel signatures, "x,y,RRGGBB" joined by "|". A screen matches when every pixel is within Tolerance.
; Lobby: ENTER's orange, the panel teal beside it, and the light Daily Dungeons bar.
Lobby=880,2040,FD9500|600,2120,EB8A00|1080,2080,025F72|100,2290,D9E4E7
; Defeat: the dark teal overlay in three places, and the X glyph's yellow.
Defeat=120,300,0A364B|880,2040,0D384C|100,2290,093346|720,2450,FFD21C
; Max difference per colour channel (0-255).
Tolerance=30

[Timing]
; Poll interval while a fight (or anything unrecognised) is on screen.
PollMs=1500
; After ENTER, wait this long before checking that the fight started.
AfterEnterMs=6000
; After closing DEFEAT, wait this long for the lobby to come back.
AfterCloseMs=2500

[Run]
; 0 = run until stopped with F8.
MaxEntries=0
; ENTER taps in a row that leave the lobby showing before the loop stops (out of keys, a popup).
LobbyStuckLimit=3
LogFile=exp-retry.log
