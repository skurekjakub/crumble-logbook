; Knobs for conquest-loop.ahk. Comments must sit on their own line (INI values don't strip inline comments).
; Points and pixels are in game pixels on the 1440x2560 portrait display, as adb sees it.

[Adb]
Path=C:\Program Files\Netease\MuMuPlayer\nx_main\adb.exe
; The emulator's adb address. A host:port serial is connected again whenever adb loses it, as it does
; when MuMu restarts; an emulator-N serial comes back only when the adb server restarts.
Serial=127.0.0.1:5557
; The game's Android package; "auto" displays are the one it runs on.
Package=com.devsisters.cc
; SurfaceFlinger display id for screencap (adb shell dumpsys SurfaceFlinger --display-id).
; auto = the game's display, found again whenever a capture fails. Empty = default display.
CaptureDisplay=auto
; Display index for `input -d`. auto = the game's display. Empty = default display.
InputDisplay=auto

[Points]
; The lobby's ENTER button.
EnterX=712
EnterY=2172
; The bottom-centre button that closes the results (the nav bar's centre button).
; In a running fight it asks whether to end the battle, so it is only tapped after the fight can
; have ended, or to end a run on purpose.
DismissX=720
DismissY=2470
; End Battle on that question.
EndBattleX=988
EndBattleY=2248
; Recovery route back to the lobby: the bottom bar's Guild button, then the guild hall's Guild Conquest building.
GuildNavX=933
GuildNavY=2413
ConquestX=267
ConquestY=1450
; Random offset in pixels added to every tap. 0 = exact.
JitterPx=6

[Detect]
; Pixel signatures, "x,y,RRGGBB" joined by "|". A screen matches when every pixel is within Tolerance.
; Lobby: the Lineup and Auto greens, the power row teal, and the panel teal under ENTER.
Lobby=1200,1374,00CB8F|100,1494,005667|60,2300,007E91|1100,2290,007E91|1320,2160,00CB8F
; ENTER lit (orange). Greyed between seasons. Learn the exact colour with F9 on the live lobby.
EnterReady=880,2144,FD9500
; "Are you sure you want to end the battle?": End Battle's orange, Continue's teal, the panel's dark teal.
EndConfirm=880,2230,FD9A0D|1100,2260,FD9500|300,2230,14AEB8|720,2060,005E72
; The result screen, learned with F9. Empty = dismiss on time (MinFightMs) instead.
Result=
; The points F9 samples to learn the result screen.
ResultPoints=200,300|720,300|1240,300|200,1280|720,1280|1240,1280|200,2300|720,2300|1240,2300
; Max difference per colour channel (0-255).
Tolerance=30

[Timing]
; How often the screen is checked.
PollMs=2000
; After ENTER, wait this long before checking that the fight started.
AfterEnterMs=6000
; With no result screen learned: from ENTER until Dismiss is first tapped (loading + the 60 s fight).
MinFightMs=66000
; From ENTER until, with no lobby showing, the loop navigates back to it (Recover).
MaxFightMs=100000
; Wait after each recovery tap or Back before checking the screen.
RecoverStepMs=4000
; After relaunching the game, wait this long for it to load before navigating.
LaunchWaitMs=90000
; From ENTER until the loop starts reading the HUD for the pace check. The countdown starts about
; 2 s after ENTER, so 24000 starts reading at about 38 s left.
PruneFromMs=24000
; After tapping the bottom-centre button in a fight, wait this long for the end-battle question.
ConfirmWaitMs=1500
; After End Battle, wait this long for the results before dismissing them.
AfterEndMs=4000
; On the results, keep reading the final score this long before recording the run without it.
FinalWaitMs=8000

[Prune]
; End a fight whose score is below MinScore when the countdown shows CheckAtS seconds left.
; 1950000000000 = 2T less 2.5% leniency. 0 = never end a fight early.
MinScore=1950000000000
CheckAtS=30
; Give up the check (and keep the run) if no score is read by CheckAtS - LateS seconds left.
LateS=3
; Node.js 24+, which runs tools/conquest-hud's TypeScript directly.
Node=node

[Run]
; 0 = run until stopped with F8.
MaxRuns=0
; ENTER taps in a row that leave the lobby showing before the loop leaves and comes back.
StuckLimit=3
; Polls in a row with the lobby showing ENTER greyed before the loop stops (the season is closed).
; The lobby greys ENTER for a moment on its way back from the results.
GreyLimit=8
; Recovery tries (Guild, Guild Conquest, Back) before the loop stops.
RecoverTries=8
; The game's launch activity, for relaunching it when it isn't on top.
Activity=com.devsisters.plugin.OvenUnityPlayerActivity
LogFile=conquest-loop.log
; One CSV row per run: time, run, end, pace_score, final_score. See README.md.
RunsFile=conquest-runs.csv
