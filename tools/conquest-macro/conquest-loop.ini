; Knobs for conquest-loop.ahk. Comments must sit on their own line (INI values don't strip inline comments).
; Points and pixels are in game pixels on the 1440x2560 portrait display, as adb sees it.

[Adb]
Path=C:\Program Files\Netease\MuMuPlayer\nx_main\adb.exe
Serial=emulator-5556
; SurfaceFlinger display id for screencap (adb shell dumpsys SurfaceFlinger --display-id). Empty = default display.
CaptureDisplay=4619827767814508545
; Display index for `input -d`.
InputDisplay=2

[Points]
; The lobby's ENTER button.
EnterX=712
EnterY=2172
; The bottom-centre button that closes the results (the nav bar's centre button).
; In a running fight it leaves the fight, so it is only tapped after the fight can have ended.
DismissX=720
DismissY=2470
; Random offset in pixels added to every tap. 0 = exact.
JitterPx=6

[Detect]
; Pixel signatures, "x,y,RRGGBB" joined by "|". A screen matches when every pixel is within Tolerance.
; Lobby: the Lineup and Auto greens, the power row teal, and the panel teal under ENTER.
Lobby=1200,1374,00CB8F|100,1494,005667|60,2300,007E91|1100,2290,007E91|1320,2160,00CB8F
; ENTER lit (orange). Greyed between seasons. Learn the exact colour with F9 on the live lobby.
EnterReady=880,2144,FD9500
; The result screen, learned with F9. Empty = dismiss on time (MinFightMs) instead.
Result=
; The points F9 samples to learn the result screen.
ResultPoints=200,300|720,300|1240,300|200,1280|720,1280|1240,1280|200,2300|720,2300|1240,2300
; Max difference per colour channel (0-255).
Tolerance=30

[Timing]
; How often the screen is checked.
PollMs=2000
; After ENTER, wait this long before checking that the fight started.
AfterEnterMs=6000
; With no result screen learned: from ENTER until Dismiss is first tapped (loading + the 60 s fight).
MinFightMs=66000
; From ENTER until Dismiss is tapped regardless of what the screen shows.
MaxFightMs=100000
; After MaxFightMs, how long Dismiss is tapped without the lobby coming back before the loop stops.
StallMs=60000

[Run]
; 0 = run until stopped with F8.
MaxRuns=0
; ENTER taps in a row that leave the lobby showing before the loop stops.
StuckLimit=3
LogFile=conquest-loop.log
