; Knobs for conquest-loop.ahk. Comments must sit on their own line (INI values don't strip inline comments).
; Points are fractions of the game area: 0,0 = top-left, 1,1 = bottom-right. Calibrate with F7 / F9.

[Window]
; Substring of the game window's title (SetTitleMatchMode 2). An "ahk_exe name.exe" criterion also works.
Title=CookieRun
; Width / height of the game picture inside the window. 0 = the whole client area is the game.
; Use it when the emulator pillarboxes a portrait game, e.g. 0.5625 (9:16) or 0.4615 (9:19.5).
GameAspect=0
; Click = real mouse click (window is activated first). ControlClick = background click; many emulators ignore it.
ClickMethod=Click
; Input, Event or Play. Some emulators only accept Event.
SendMode=Input

[Points]
; The lobby's Enter button (도전하기).
EnterX=0.50
EnterY=0.88
; Optional confirmation popup after Enter; only used when ConfirmEnabled=1.
ConfirmX=0.62
ConfirmY=0.60
; A spot that closes the result screens and popups without starting anything
; (the result screen's OK/close, or a neutral tap-to-continue area). Must not be the Enter button.
DismissX=0.50
DismissY=0.93
; A pixel on the Enter button whose colour proves the lobby is showing.
LobbyPixelX=0.50
LobbyPixelY=0.88

[Timing]
ConfirmEnabled=0
ConfirmDelayMs=1500
; From tapping Enter until the fight clock starts (loading + START banner).
PostEnterDelayMs=6000
; Always waited in full, even when the team wipes at 17 s, so surviving cookies keep scoring.
FightSeconds=60
; Extra time for the score tally / BATTLE OVER animation before dismissing.
EndBufferMs=5000
DismissTaps=3
DismissIntervalMs=1500
; Pause after dismissing before looking for the lobby again.
PostDismissDelayMs=3000
ClickHoldMs=60
; Random offset in pixels added to every tap. 0 = exact.
JitterPx=3

[Detect]
; 1 = only tap Enter when LobbyPixel shows LobbyColor. 0 = rely on timing alone.
UseLobbyColor=1
; 0xRRGGBB. Capture it with F9 > "Set LobbyPixel + colour here".
LobbyColor=0xF7931E
; Max difference per colour channel (0-255).
ColorTolerance=40
; Time spent tapping Dismiss before a stall is counted.
LobbyTimeoutMs=30000
; Send Esc on a stall (closes most popups).
EscapeOnStuck=1
; Consecutive stalls before the loop stops itself.
StuckLimit=5

[Run]
; 0 = run until stopped with F8.
MaxRuns=0
LogFile=conquest-loop.log
