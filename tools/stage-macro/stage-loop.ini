; Knobs for stage-loop.ahk. Comments must sit on their own line (INI values don't strip inline comments).
; Points and pixels are in game pixels on the 1440x2560 portrait display, as adb sees it.

[Adb]
Path=C:\Program Files\Netease\MuMuPlayer\nx_main\adb.exe
; The emulator's adb address. A host:port serial is connected again whenever adb loses it, as it does
; when MuMu restarts; an emulator-N serial comes back only when the adb server restarts.
Serial=127.0.0.1:5557
; The game's Android package; "auto" displays are the one it runs on.
Package=com.devsisters.cc
; SurfaceFlinger display id for screencap and screenrecord. auto = the game's display.
CaptureDisplay=auto
; Display index for `input -d`, taps and key holds. auto = the game's display.
InputDisplay=auto

[Points]
; Summon Boss, under the stage's bar.
SummonX=720
SummonY=380
; Random offset in pixels added to every tap. 0 = exact.
JitterPx=6

[Detect]
; Pixel signatures, "x,y,RRGGBB" joined by "|". A screen matches when every pixel is within Tolerance.
; Summon Boss: the button's red and orange stripes and its yellow lettering.
Summon=600,360,FB3B00|660,360,F93D00|820,360,FB3B00|640,400,FFF647|720,400,FFF647
; A boss encounter: the red boss icon left of the boss's health bar.
Boss=320,380,FF632D|360,380,FF632D|320,400,FF3617|380,400,FF3617
; Max difference per colour channel (0-255).
Tolerance=30

[Timing]
; How often the screen is checked.
PollMs=1000
; Polls in a row on Summon Boss without a readable stage number before the loop stops.
UnreadLimit=10
; From the tap on Summon Boss: with no encounter seen by then and Summon Boss still up, the tap
; didn't start one, and the loop summons again. Summon Boss stays up about 1.5 s after a tap.
StartWaitMs=12000

[Stages]
; Worlds repeat every this many chapters: chapter 358 is world 358 mod 9 = 7.
Worlds=9
; Movement scripts, one per stage: <ScriptDir>\w<world>\<stage>.txt. See README.md.
ScriptDir=stages
; 1 = a stage without a script whose boss won waits for its script before trying again.
WaitForScript=1

[Record]
; 1 = record every boss encounter to VideoDir (gitignored), named <stage>_<try>_<time>.mp4.
Video=1
; screenrecord's time limit, from the tap on Summon Boss.
Seconds=45
; screenrecord's bit rate. The video stays at the display's size: a downscaled recording dies when
; the scene changes for the boss.
BitRate=4000000
VideoDir=recordings

[Run]
; Tries in a row a stage may lose before the loop stops. 0 = never stop.
MaxTries=0
LogFile=stage-loop.log
; One CSV row per boss encounter: time, chapter, stage, world, try, script, result, video.
RunsFile=stage-runs.csv

[Hud]
; Node.js 24+, which runs tools/hud's TypeScript directly.
Node=node
